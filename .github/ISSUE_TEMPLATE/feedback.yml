name: Share feedback
description: An idea, a missing course or major, or anything that could work better.
title: "Feedback: "
labels: ["enhancement"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What would make PlanUR more useful to you?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and device
      description: Filled in automatically when you use the button in PlanUR.
      render: text
